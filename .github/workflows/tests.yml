name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The API tests inject stub dependencies instead of importing qsprpred,
      # rdkit or vina, so the suite needs only Flask and the dev tools. That
      # keeps this job fast and avoids building the heavy scientific stack.
      #
      # Flask's pin is read out of requirements.txt rather than repeated here,
      # so the tests always run against the version the image ships. An empty
      # match fails the step instead of silently resolving a different version.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          flask_pin="$(grep -E '^flask==' requirements.txt)"
          echo "using $flask_pin"
          python -m pip install "$flask_pin" -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
