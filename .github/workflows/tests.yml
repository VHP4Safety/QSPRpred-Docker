name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The API tests inject stub dependencies instead of importing qsprpred,
      # rdkit or vina, so the suite needs only Flask and the dev tools. That
      # keeps this job fast and avoids building the heavy scientific stack.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'flask>=3.1.1' -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
